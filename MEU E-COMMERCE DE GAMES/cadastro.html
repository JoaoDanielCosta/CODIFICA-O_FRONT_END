<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
</head>
<body>
<header>
 
    <H1>JOÃO TECH</H1>

<nav>  
<ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#produtos">Produtos</a></li>
    <li><a href="#sobre">Sobre</a></li>
    <li><a href="#contato">Contato</a></li>   
</ul>    
</nav>


</header>
<main>

    <section id="Formulario">

<h4>FORMULÁRIO</h4>
<BR>
<form
id="form-contact"
action="/enviar"
method="POST">



<legend>Dados de Acesso</legend>

<label for="input-name">
Nome:
</label>

<input
type="text"
id="input-name"
name="name"
placeholder="Digite seu Nome..."
minlength="3"
required>

<label for="input-idade">
Idade:
</label>
<input
type="number"
id="input-idade"
name="idade"
placeholder="Digite sua Idade"
min="18"
max="120"
required>

<label for="input-email">
Email:
</label>
<input
type="email"
id="input-name"
name="email"
placeholder="Digite seu E-mail"
required>

<label for="input-password">
Senha:
</label>
<input
type="password"
id="input-password"
name="password"
placeholder="Digite sua Senha"
minlength="8"
required>

<input type="radio"
name="op"
id="pf"
value="pf">

<label for="radio-pf">Pessoa Física</label>

<input type="radio"
name="op"
id="pj"
value="pj">

<label for="radio-pj">Pessoa Jurídica</label>

</fieldset>

<fieldset>
<legend>Categorias dos Produtos</legend>

<label for="categorias">Opções de Produtos:</label>

<select name="categorias"
id="input-category">

<option value="" selected disabled>Selecione...</option>

<option
value="Periféricos">Periféricos
</option>
<option
value="Consoles">Consoles</option>

<option
value="Hardwares">Hardwares</option>

<option
value="Movéis/Conforto">Móveis/Conforto</option>
</select>

<label for="promo">Receba Ofertas Por:</label>

<input type="checkbox"
name="pref"
id="Whatsapp"
value="Whatsapp">

<label for="check-
offers">Whatsapp</label>

<input type="checkbox"
name="pref"
id="E-mail"
value="E-mail">

<label for="check-
news">E-mail</label>

<input type="checkbox"
name="pref"
id="Ligação"
value="Ligação">

<label for="check-
news">Ligação</label>

</fieldset>

<label for="mensagem">Mensagem:</label>
<textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite sua mensagem"></textarea>

<button type="submit">
Enviar
</button>
<button type="reset">
Apagar
</button>
