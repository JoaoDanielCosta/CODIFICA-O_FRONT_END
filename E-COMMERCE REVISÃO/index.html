<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão</title>
    <link rel="stylesheet" href=".css/style.css">
</head>
<body>
  <header>
    <h1>Meu Catálogo de Filme</h1>
  </header>  

  <main>
    
    <section id="cadastro">
    <h2>Cadastrar Novo Filme</h2>
        <form id="form-cadastro">
            <input type="text" id="nome-item" placeholder="Título do Filme">
            <input type="url" id="url-imagem" placeholder="URL da Imagem do Filme">
            <button type="submit">Adicionar ao Catálogo</button>
        </form>
    </section>

    <section id="Catalogo">
        <h2>Meus Filmes Favoritos</h2>
        <section id="lista-filmes"></section>

    </section>
    </main>
    <footer>&copy Atividade de Revisão!</footer>
</body>
</html>
